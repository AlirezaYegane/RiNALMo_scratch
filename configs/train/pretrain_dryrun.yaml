seed: 42

run:
  name: pretrain_dryrun

paths:
  output_dir: outputs/pretrain_dryrun

trainer:
  max_epochs: 1
  max_steps: 500
  accelerator: ${runtime.accelerator}
  devices: ${runtime.devices}
  precision: ${runtime.precision}
  gradient_clip_val: 1.0
  log_every_n_steps: 1
  accumulate_grad_batches: 1
  resume: null
  num_sanity_val_steps: ${runtime.num_sanity_val_steps}

callbacks:
  checkpoint:
    monitor: train/loss_epoch
    mode: min
    save_top_k: 1
    every_n_epochs: 1
    save_last: true
  disk_guard:
    min_free_gb: 20.0
    check_every_n_steps: 50

logging:
  wandb:
    enabled: false

optimization:
  lr: 5.0e-5
  min_lr: 1.0e-5
  warmup_steps: 50
  weight_decay: 0.01
