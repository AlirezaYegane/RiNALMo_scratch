seed: 42

run:
  name: pretrain_smoke

paths:
  output_dir: outputs/pretrain_smoke

trainer:
  max_epochs: 1
  max_steps: 20
  accelerator: cpu
  devices: 1
  precision: 32-true
  gradient_clip_val: 1.0
  log_every_n_steps: 1
  accumulate_grad_batches: 1
  resume: null

callbacks:
  checkpoint:
    monitor: train/loss_epoch
    mode: min
    save_top_k: 1
    every_n_epochs: 1
    save_last: true
  disk_guard:
    min_free_gb: 5.0
    check_every_n_steps: 50

logging:
  wandb:
    enabled: false

optimization:
  lr: 5.0e-5
  min_lr: 1.0e-5
  warmup_steps: 10
  weight_decay: 0.01
