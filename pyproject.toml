[build-system]
requires = ["setuptools>=69,<81", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rinalmo"
version = "0.1.0"
description = "RiNALMo hardening fork with src-layout packaging and reproducible training setup"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
  { name = "RiNALMo authors" }
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Operating System :: POSIX :: Linux",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
  "numpy>=1.24,<3",
  "PyYAML>=6,<7",
  "tqdm>=4.66,<5",
  "ml_collections>=0.1.1",
  "packaging>=23.2,<25",
  "gdown>=5.1.0"
]

[project.optional-dependencies]
train = [
  "lightning>=2.1,<2.5",
  "pandas>=2.0,<3",
  "scikit-learn>=1.3,<2",
  "scipy>=1.10,<2",
  "wandb>=0.17,<0.20"
]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<6",
  "ruff>=0.6,<1",
  "mypy>=1.10,<2"
]
flash = [
  "flash-attn==2.3.2; platform_system == 'Linux'"
]
wandb = [
  "wandb>=0.17,<0.20"
]
bio-tools = [
  "biopython>=1.84,<2"
]

[project.urls]
Homepage = "https://github.com/lbcb-sci/RiNALMo"
Repository = "https://github.com/lbcb-sci/RiNALMo"

[tool.setuptools]
include-package-data = true
license-files = ["LICENSE*"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
include = ["rinalmo*"]

[tool.setuptools.package-data]
rinalmo = ["resources/*.json", "resources/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
check_untyped_defs = false

[tool.coverage.run]
source = ["src/rinalmo"]

[tool.coverage.report]
show_missing = true
skip_covered = false
