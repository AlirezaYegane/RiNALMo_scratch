name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}
      MYPYPATH: ${{ github.workspace }}/src

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: upgrade pip
        run: python -m pip install --upgrade pip

      - name: install project
        run: pip install -e ".[train,dev]"

      - name: ruff (scoped)
        run: |
          ruff check \
            tests/integration/repro \
            scripts/ops/check_h200_readiness.py \
            scripts/data/validate_pretrain_manifest.py \
            scripts/train/pretrain.py \
            train_expression_level.py \
            train_ribosome_loading.py \
            train_sec_struct_prediction.py \
            train_splice_site_prediction.py \
            train_translation_efficiency.py \
            src/rinalmo/runtime \
            src/rinalmo/training \
            src/rinalmo/hydra_bridge \
            src/rinalmo/data/pretrain

      - name: mypy (scoped)
        run: |
          mypy --explicit-package-bases \
            src/rinalmo/runtime \
            src/rinalmo/training \
            src/rinalmo/hydra_bridge \
            src/rinalmo/data/pretrain

      - name: pytest
        run: pytest -q tests/unit tests/integration -rA

      - name: readiness
        run: python scripts/ops/check_h200_readiness.py
